[project]
name = "oncall"
version = "0.1.0"
description = "A5 — Incident Investigation Copilot: an on-call assistant that retrieves logs, runs sandboxed diagnostics, and drafts incident reports"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "sse-starlette>=2.1",
    "structlog>=24.4",
    "slowapi>=0.1.9",
    "httpx>=0.27",
    "truststore>=0.9",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "zarreh-agentkit",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "import-linter>=2.1",
    "detect-secrets>=1.5",
    "pre-commit>=4.0",
    "respx>=0.23",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "matplotlib>=3.9",
]

[project.urls]
Repository = "https://github.com/zarreh/incident_copilot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oncall"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src", "data", "evals", "tests"]

[[tool.mypy.overrides]]
module = "truststore.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/oncall"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.importlinter]
root_package = "oncall"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layering: api -> graph -> guardrails -> tools -> retrieval -> schemas"
type = "layers"
layers = [
    "oncall.api",
    "oncall.graph",
    "oncall.guardrails",
    "oncall.tools",
    "oncall.retrieval",
    "oncall.schemas",
]

[[tool.importlinter.contracts]]
name = "tools, guardrails and retrieval never import graph"
type = "forbidden"
source_modules = [
    "oncall.tools",
    "oncall.guardrails",
    "oncall.retrieval",
]
forbidden_modules = ["oncall.graph"]

[tool.uv.sources]
zarreh-agentkit = { git = "https://github.com/zarreh/zarreh_agentkit.git", tag = "v0.2.0" }
